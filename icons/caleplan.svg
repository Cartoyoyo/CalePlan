<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>CalePlan</title>
  <!-- plan : page légèrement penchée, avec deux repères -->
  <g transform="rotate(-4 23 46)">
    <rect x="6" y="20" width="36" height="50" rx="2.5" fill="#fff" stroke="#488830" stroke-width="2.6"/>
    <path d="M12 28H34M12 34H30" stroke="#c0c850" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- carte : carreau quadrillé avec une route -->
  <rect x="58" y="32" width="36" height="48" rx="3" fill="#b8d858" stroke="#488830" stroke-width="2.6"/>
  <path d="M70 32V80M82 32V80M58 48H94M58 64H94" stroke="#78a840" stroke-width="1.5"/>
  <path d="M58 70L94 44" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- liens pointillés entre repères du plan et repères de la carte -->
  <path d="M18 38C38 30 52 40 69 47M30 58C50 70 66 70 83 66" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="3.4 2.6" stroke-linecap="round"/>
  <g fill="#fff" stroke="#488830" stroke-width="2.4"><circle cx="18" cy="38" r="4.6"/><circle cx="30" cy="58" r="4.6"/></g>
  <g fill="#ea580c" stroke="#9a3a08" stroke-width="1"><circle cx="69" cy="47" r="4.8"/><circle cx="83" cy="66" r="4.8"/></g>
</svg>
